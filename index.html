<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Детокс-дневник</title>
<meta name="theme-color" content="#2F7D4F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Детокс">
<meta name="author" content="Дмитрий и Екатерина Мёдовы, бизнес-партнёры NL">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex, nofollow">
<script>window.APP_MODE = 'release';</script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Как в «Тонусе»: одна колонка под телефон, нижняя панель разделов, карточки для дневных блоков; цвет — зелёный */
:root{
  --bg:#F1F5F1; --surface:#FFFFFF; --ink:#14221A; --muted:#58695F; --line:#DAE3DC;
  --accent:#2F7D4F; --accent-ink:#FFFFFF; --accent-soft:#DCEEE2;
  --warm:#D9772B; --warm-soft:#FBE7D6; --water:#2B78CF; --water-soft:#DCE9F8;
  --grain:#B8862F; --grain-soft:#F6EBD3;
  --good:#23824F; --bad:#C0392F;
  --shadow:0 1px 2px rgba(20,34,26,.06),0 6px 18px rgba(20,34,26,.06);
  --f-display:'Unbounded','Onest',system-ui,sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1612; --surface:#18221C; --ink:#E5EEE8; --muted:#93A399; --line:#2A362E;
    --accent:#62C08A; --accent-ink:#06210F; --accent-soft:#173726;
    --warm:#F0A060; --warm-soft:#3A2717; --water:#6AA6EE; --water-soft:#17283D;
    --grain:#E2B866; --grain-soft:#3A2F17;
    --good:#5CC48A; --bad:#EF7A70; --shadow:0 0 0 1px #24302A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1612; --surface:#18221C; --ink:#E5EEE8; --muted:#93A399; --line:#2A362E;
  --accent:#62C08A; --accent-ink:#06210F; --accent-soft:#173726;
  --warm:#F0A060; --warm-soft:#3A2717; --water:#6AA6EE; --water-soft:#17283D;
  --grain:#E2B866; --grain-soft:#3A2F17;
  --good:#5CC48A; --bad:#EF7A70; --shadow:0 0 0 1px #24302A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}

.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(100px + env(safe-area-inset-bottom,0px))}
.view{display:grid;gap:14px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:4px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--f-display);font-weight:600;font-size:25px;line-height:1.18;margin:4px 0 0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:17px;font-weight:700;margin:0;line-height:1.3}
h3{font-size:14px;font-weight:700;margin:14px 0 4px}
p{margin:0}
.small{font-size:13px}
.muted{color:var(--muted)}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-weight:500}
.tnum{font-variant-numeric:tabular-nums}
.fine{font-size:12.5px;color:var(--muted);line-height:1.5}

.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:grid;gap:12px;min-width:0}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.btn{appearance:none;border:0;border-radius:12px;padding:11px 16px;font-weight:600;font-size:15px;cursor:pointer;background:var(--accent);color:var(--accent-ink);min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sm{min-height:36px;padding:7px 12px;font-size:14px}
.btn.wide{width:100%}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.x{appearance:none;border:0;background:transparent;width:36px;height:36px;border-radius:10px;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;flex:none}
.x:hover{background:var(--bg)}

input,select,textarea{font:inherit;font-size:16px;padding:9px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink)}
.agree input{width:22px;height:22px;min-height:0;flex:none;margin:1px 0 0;accent-color:var(--accent)}

.demo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;border:1.5px dashed var(--accent);background:var(--accent-soft);font-size:14px}
.demo div{flex:1 1 200px;min-width:0}

/* этапы */
.stagebar{display:flex;gap:3px;height:8px}
.stagebar i{display:block;border-radius:4px;background:var(--line);position:relative;overflow:hidden}
.stagebar i b{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px}
.stagelbl{display:flex;gap:3px;font-size:11px;color:var(--muted);font-weight:600}
.stagelbl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stagelbl span.on{color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);width:fit-content}
.pill.warm{background:var(--warm-soft);color:var(--warm)}
.stages{display:grid;gap:8px}
.stage{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;background:var(--bg);border-radius:14px;padding:12px}
.stage .sn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;background:var(--surface);color:var(--muted)}
.stage.cur{background:var(--accent-soft)}
.stage.cur .sn{background:var(--accent);color:var(--accent-ink)}
.stage.done .sn{color:var(--accent)}

/* схема дня */
.checks{display:grid;gap:6px}
.check{appearance:none;border:0;background:var(--bg);border-radius:12px;padding:11px 12px;display:flex;align-items:flex-start;gap:12px;text-align:left;cursor:pointer;min-height:44px;width:100%}
.check .box{flex:none;width:22px;height:22px;border-radius:7px;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;margin-top:1px}
.check.on .box{background:var(--accent);box-shadow:none}
.check.on .box::after{content:"";width:10px;height:6px;border:2.5px solid var(--accent-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.check.on .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.check .when{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.progbar{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.progbar i{display:block;height:100%;background:var(--accent)}

/* вода */
.glasses{display:flex;flex-wrap:wrap;gap:7px}
.glass{appearance:none;border:0;width:28px;height:38px;border-radius:5px 5px 10px 10px;background:var(--water-soft);cursor:pointer;position:relative;padding:0}
.glass.on{background:var(--water)}
.water-v{color:var(--water);font-weight:700}

/* самочувствие */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood{appearance:none;border:0;background:var(--bg);border-radius:12px;padding:8px 2px;display:grid;gap:2px;justify-items:center;cursor:pointer;min-height:52px}
.mood .num{font-size:18px}
.mood small{font-size:10.5px;color:var(--muted);line-height:1.15;text-align:center}
.mood.on{background:var(--accent);color:var(--accent-ink)}
.mood.on small{color:var(--accent-ink)}
.stepper{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:12px;padding:3px}
.stepper button{appearance:none;border:0;background:var(--surface);width:38px;height:38px;border-radius:10px;font-size:20px;cursor:pointer;box-shadow:var(--shadow)}
.stepper b{min-width:62px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:0;border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;background:var(--bg);color:var(--muted);cursor:pointer;min-height:36px;flex:none;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--surface)}
.chip.veg.on{background:var(--accent);color:var(--accent-ink)}
.chip.prot.on{background:var(--warm);color:#fff}
.chip.carb.on{background:var(--grain);color:#fff}
.chip.fat.on{background:var(--water);color:#fff}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{appearance:none;border:0;background:transparent;border-radius:9px;padding:7px 8px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;flex:1;min-height:36px;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.alert{background:var(--warm-soft);border-radius:14px;padding:12px 14px;font-size:14px}

/* питание */
.daynav{display:flex;align-items:center;gap:4px}
.daynav button{appearance:none;border:0;background:var(--surface);box-shadow:var(--shadow);width:40px;height:40px;border-radius:12px;font-size:20px;cursor:pointer}
.daynav button:disabled{opacity:.35;cursor:default}
.meal{display:grid;gap:8px}
.plate{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.plate svg{width:132px;height:132px;display:block}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px}
.legend li{display:grid;grid-template-columns:12px 1fr;gap:8px;align-items:start}
.legend li::before{content:"";width:12px;height:12px;border-radius:4px;margin-top:4px;background:var(--c)}
.blist{margin:0;padding-left:20px;display:grid;gap:4px;font-size:15px}
details{border-top:1px solid var(--line);padding-top:10px}
details:first-of-type{border-top:0;padding-top:0}
details summary{cursor:pointer;font-weight:700;font-size:15px;list-style-position:outside}
details > div{display:grid;gap:8px;margin-top:8px}
.ideas{list-style:none;margin:0;padding:0;display:grid}
.ideas li{padding:9px 0;border-top:1px solid var(--line);display:grid;gap:2px}
.ideas li:first-child{border-top:0}
.ideas b{font-weight:600}

/* темы и задания */
.lesson{display:grid;gap:10px;font-size:15.5px;line-height:1.5}
.lesson h3{margin:6px 0 0;font-size:15px}
.lesson ul{margin:0;padding-left:20px;display:grid;gap:5px}
.task{background:var(--accent-soft);border-radius:14px;padding:12px 14px;display:grid;gap:8px}
.task > b{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.lrow{appearance:none;border:0;width:100%;text-align:left;cursor:pointer;background:transparent;display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow .d{flex:none;width:44px;height:44px;border-radius:12px;background:var(--bg);display:grid;place-items:center;text-align:center;font-size:10px;line-height:1.1;color:var(--muted);font-weight:600}
.lrow .d b{display:block;font-family:var(--f-display);font-size:16px;color:var(--ink);font-weight:600}
.lrow.today .d{background:var(--accent);color:var(--accent-ink)}
.lrow.today .d b{color:var(--accent-ink)}
.lrow .lt{flex:1;min-width:0}
.lrow .ok{color:var(--accent);font-weight:700;font-size:14px}
.lrow.later{opacity:.6}

/* продукты */
.tile{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:15px;background:var(--accent-soft);color:var(--accent)}
.tile.food{background:var(--warm-soft);color:var(--warm)}
.tile.big{width:58px;height:58px;font-size:18px;border-radius:16px}
.plist{display:grid;gap:8px}
.prow{appearance:none;border:0;width:100%;text-align:left;cursor:pointer;background:var(--bg);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:12px}
.prow .pm{flex:1;min-width:0}
.pn{font-weight:600;overflow-wrap:anywhere}
.infobox{display:grid;gap:8px;justify-items:start;background:var(--bg);border-radius:14px;padding:12px 14px}

/* прогресс */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);display:grid;gap:2px;min-width:0}
.good{color:var(--good)} .bad{color:var(--bad)}
.stat .num{font-size:20px}
.stat .num small{font-family:var(--f-body);font-size:13px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.cal i{aspect-ratio:1;border-radius:6px;background:var(--bg);display:grid;place-items:center;font-size:10px;font-style:normal;color:var(--muted);font-weight:600}
.cal i.l1{background:color-mix(in srgb,var(--accent) 25%,var(--bg))}
.cal i.l2{background:color-mix(in srgb,var(--accent) 55%,var(--bg));color:var(--accent-ink)}
.cal i.l3{background:var(--accent);color:var(--accent-ink)}
.cal i.now{box-shadow:inset 0 0 0 2px var(--ink)}
.cal i.sep{grid-column:1/-1;aspect-ratio:auto;background:none;justify-items:start;font-size:11px;padding-top:4px}
.cmp{display:grid;gap:8px}
.cmp .r{display:grid;grid-template-columns:110px 1fr 56px;gap:10px;align-items:center;font-size:14px}
.cmp .bars{display:grid;gap:3px}
.cmp .bars i{display:block;height:7px;border-radius:4px;background:var(--line)}
.cmp .bars i.b{background:var(--accent)}
.chart svg{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .lbl{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .end{fill:var(--accent)}
.chart .endl{fill:var(--ink);font-size:12px;font-weight:700;font-family:var(--f-body)}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.hist li:first-child{border-top:0}
.hist .hd{flex:1;min-width:0}

/* дыхание */
.breath{display:grid;justify-items:center;gap:14px;padding:6px 0 4px}
.bc{width:210px;height:210px;border-radius:50%;background:radial-gradient(circle at 50% 45%,var(--accent-soft),color-mix(in srgb,var(--accent) 35%,var(--accent-soft)));display:grid;place-items:center;transform:scale(.62);transition-property:transform;transition-timing-function:ease-in-out}
.bc.big{transform:scale(1)}
.bc span{font-family:var(--f-display);font-weight:600;font-size:17px;transform:scale(1.4)}
.bcount{font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums}

/* панель разделов */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{appearance:none;border:0;background:transparent;display:grid;justify-items:center;gap:3px;padding:9px 2px 8px;cursor:pointer;color:var(--muted);font-size:11px;font-weight:600;min-height:56px}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}

/* окно снизу */
.sheet-wrap{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet-back{position:absolute;inset:0;background:rgba(8,14,10,.45)}
.sheet{position:relative;width:100%;max-width:560px;max-height:90vh;max-height:90dvh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:8px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
.sheet-grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 2px}
.sheet-head{display:flex;align-items:center;gap:12px}
.sheet-head > div{flex:1;min-width:0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--surface);border-radius:14px;padding:11px 14px;font-size:14px;display:flex;gap:14px;align-items:center;width:max-content;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast button{appearance:none;border:0;background:transparent;color:var(--surface);font-weight:700;text-decoration:underline;cursor:pointer;padding:4px}

.notes{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.notes li{display:grid;grid-template-columns:8px 1fr;gap:10px;align-items:start;font-size:15px}
.notes li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:7px}
.back{border:2px solid var(--accent)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.setrow > span{min-width:0}

@media (max-width:360px){
  .plate{grid-template-columns:1fr;justify-items:center}
  .cmp .r{grid-template-columns:90px 1fr 48px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>

<div class="app">
  <section class="view" id="v-today"></section>
  <section class="view" id="v-food" hidden></section>
  <section class="view" id="v-program" hidden></section>
  <section class="view" id="v-progress" hidden></section>
  <section class="view" id="v-profile" hidden></section>
</div>

<nav class="tabs" aria-label="Разделы">
  <div class="tabs-in">
    <button class="tab" data-act="tab" data-v="today" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>Сегодня</span></button>

/* ---------- утилиты ---------- */
const pad = n => String(n).padStart(2,'0');
const dkey = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const todayKey = () => dkey(new Date());
const daysBetween = (a,b) => Math.round((parseKey(b) - parseKey(a)) / 864e5);
const fmtDay = k => parseKey(k).toLocaleDateString('ru-RU', { day:'numeric', month:'long' });
const fmtShort = k => parseKey(k).toLocaleDateString('ru-RU', { day:'numeric', month:'short' }).replace('.', '');
const fmtN = (n,d=1) => Number(n).toLocaleString('ru-RU', { maximumFractionDigits:d }).replace('-', '−');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const $ = id => document.getElementById(id);
const prod = id => PRODUCTS.find(p => String(p.id) === String(id));
const plural = (n, one, few, many) => { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? many : b === 1 ? one : b >= 2 && b <= 4 ? few : many; };
const nDays = n => n + ' ' + plural(n, 'день', 'дня', 'дней');
const sx = (m, f) => S.profile.sex === 'm' ? m : f;
const stageOf = day => STAGES.find(s => day >= s.from && day <= s.to) || null;

/* ---------- расчёты ---------- */
const progDay = (k = todayKey()) => S.profile.start ? daysBetween(S.profile.start, k) + 1 : null;
const dayKeyOf = n => dkey(addDays(parseKey(S.profile.start), n - 1));
function dayScore(k){   // доля выполненного за день: схема + вода + тарелка
  const n = progDay(k), items = schedFor(n), ch = S.checks[k] || {};
  if (!items.length) return 0;
  const meals = S.meals[k] || {};
  const plates = ['breakfast','lunch','dinner'].filter(m => plateOk(meals[m])).length;
  const done = items.filter(i => ch[i.id]).length + ((S.water[k] || 0) >= waterGoal() ? 1 : 0) + Math.min(plates, 2)/2;
  return done / (items.length + 2);
}
const plateOk = m => !!(m && m.veg && m.prot && (m.carb || m.fat));
const waterGoal = () => S.profile.water || 2500;
function sortedWeights(){ return S.weights.slice().sort((a,b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0); }
function lastWith(f){ const w = sortedWeights().filter(x => x[f] != null); return w.length ? w[w.length-1] : null; }
function gutDelayDays(){   // сколько дней подряд (до сегодня включительно) отмечено «Не было стула»
  let n = 0, d = new Date();
  while ((S.feel[dkey(d)] || {}).gut === 'delay'){ n++; d = addDays(d, -1); }
  return n;
}

/* «С возвращением»: пропущено 2 дня и больше во время программы */
function noteVisit(){
  const t = todayKey();
  if (S.lastSeen === t) return false;
  const missed = S.lastSeen ? daysBetween(S.lastSeen, t) - 1 : 0, n = progDay(t);
  if (missed >= 2 && !S.demo && n >= 1 && n <= TOTAL_DAYS) S.back = { d:t, missed };
  S.lastSeen = t; save();
  return true;
}

function cmpHTML(sa, sb){
  return `<div class="cmp">${SCORES.map(([id, l]) => { const x = (sa || {})[id], y = sb ? (sb || {})[id] : null;
    return `<div class="r"><span>${l}</span><div class="bars"><i style="width:${(x || 0)*20}%"></i>${sb ? `<i class="b" style="width:${(y || 0)*20}%"></i>` : ''}</div><span class="tnum small">${x || '—'}${sb ? ' → ' + (y || '—') : ''} / 5</span></div>`; }).join('')}
    ${sb ? '<p class="fine">Серая полоса — точка А, зелёная — точка Б.</p>' : ''}</div>`;

function calendarHTML(n){
  let out = '';
  for (let d = 1; d <= TOTAL_DAYS; d++){
    if (d === 1 || d === 31) out += `<i class="sep">${d === 1 ? 'Детокс · дни 1–30' : 'Микробиом · дни 31–58'}</i>`;
    const k = dayKeyOf(d), s = d <= n ? dayScore(k) : 0, lv = d > n ? '' : s >= .85 ? 'l3' : s >= .5 ? 'l2' : s > 0 ? 'l1' : '';
    out += `<i class="${lv} ${d === n ? 'now' : ''}" title="День ${d}">${d}</i>`;
  }
  return out;
}
function weightChart(){
  const pts = sortedWeights().filter(w => w.kg != null);
  if (pts.length < 2) return `<p class="muted small">Добавьте хотя бы два замера веса, и здесь появится график.</p>`;
  const W = 340, H = 170, L = 34, R = 40, T = 14, B = 24;
  const t0 = parseKey(pts[0].d).getTime(), t1 = parseKey(pts[pts.length-1].d).getTime();
  let lo = Math.min(...pts.map(p => p.kg)), hi = Math.max(...pts.map(p => p.kg));
  const span = Math.max(hi - lo, 1), step = span <= 2 ? 0.5 : span <= 6 ? 1 : 2;
  lo = Math.floor((lo - step*0.3)/step)*step; hi = Math.ceil((hi + step*0.3)/step)*step;
  const x = t => L + (t1 === t0 ? 0.5 : (t - t0)/(t1 - t0))*(W - L - R);
  const y = v => T + (hi - v)/(hi - lo)*(H - T - B);
  let grid = '';
  for (let v = lo; v <= hi + 1e-9; v += step) grid += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="lbl" x="${L - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${fmtN(v)}</text>`;
  const xy = pts.map(p => [x(parseKey(p.d).getTime()), y(p.kg)]);
  const line = xy.map((q,i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
  const area = line + ` L${xy[xy.length-1][0].toFixed(1)} ${H - B} L${xy[0][0].toFixed(1)} ${H - B} Z`;
  const last = xy[xy.length-1], lastKg = pts[pts.length-1].kg;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Вес с ${fmtShort(pts[0].d)} по ${fmtShort(pts[pts.length-1].d)}: от ${fmtN(pts[0].kg)} до ${fmtN(lastKg)} кг">
    ${grid}<path class="ar" d="${area}"/><path class="ln" d="${line}"/>
    ${xy.slice(0,-1).map(q => `<circle class="dot" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="2.6"/>`).join('')}
    <circle class="end" cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="5"/>
    <text class="endl" x="${(last[0] + 8).toFixed(1)}" y="${(last[1] + 4).toFixed(1)}">${fmtN(lastKg)}</text>
    <text class="lbl" x="${L}" y="${H - 6}">${fmtShort(pts[0].d)}</text>
    <text class="lbl" x="${W - R}" y="${H - 6}" text-anchor="end">${fmtShort(pts[pts.length-1].d)}</text>
  </svg>`;
}

function stopBreath(){ clearTimeout(breathTimer); clearInterval(breathTimer); breathTimer = null; if (sh && sh.kind === 'breath') sh.run = false; }
function startBreath(){
  const b = BREATH.find(x => x.id === sh.id), bc = $('bc'), lbl = $('bphase'), left = $('bleft');
  sh.run = true; $('bgo').textContent = 'Остановить';
  const cycleLen = b.phases.reduce((s, p) => s + p[1], 0);
  const total = b.cycles ? b.cycles*cycleLen : b.min*60, end = Date.now() + total*1000;
  let i = 0, cycles = 0;
  const step = () => {
    if (!sh || !sh.run) return;
    if (Date.now() >= end - 200){ finishBreath(); return; }
    const [name, sec, kind] = b.phases[i];
    lbl.textContent = name;
    bc.style.transitionDuration = sec + 's';
    if (kind === 'in') bc.classList.add('big'); else if (kind === 'out') bc.classList.remove('big');
    const secLeft = Math.ceil((end - Date.now())/1000);
    left.textContent = b.cycles ? `${b.cycles - cycles} ${plural(b.cycles - cycles, 'цикл', 'цикла', 'циклов')}` : `${Math.floor(secLeft/60)}:${pad(secLeft % 60)}`;
    i = (i + 1) % b.phases.length; if (i === 0) cycles++;
    breathTimer = setTimeout(step, sec*1000);
  };
  step();
}
function finishBreath(){
  stopBreath();
  const t = todayKey(); (S.habits[t] = S.habits[t] || {}).breath = true; save();
  const b = BREATH.find(x => x.id === sh.id);
  $('bphase').textContent = 'Готово'; $('bc').classList.remove('big');

}

/* ================= навигация ================= */
let view = 'today';
const RENDER = { today:renderToday, food:renderFood, program:renderProgram, progress:renderProgress, profile:renderProfile };
function show(v, to){
  view = VIEWS.includes(v) ? v : 'today';
  if (view !== 'profile') confirmAct = null;
  VIEWS.forEach(id => { $('v-' + id).hidden = id !== view; });
  document.querySelectorAll('.tab').forEach(b => b.dataset.v === view ? b.setAttribute('aria-current','page') : b.removeAttribute('aria-current'));
  RENDER[view]();
  try { history.replaceState(null, '', '#' + view); } catch(e){}
  if (to){ requestAnimationFrame(() => { const el = $(to); if (el) el.scrollIntoView({ block:'start', behavior:'smooth' }); }); }
  else window.scrollTo(0, 0);
}
function commit(){ save(); RENDER[view](); }
let toastTimer = null, toastUndo = null;
function toast(msg, undo){
  const el = $('toast');
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button data-act="undo">Вернуть</button>' : ''}`;
  el.hidden = false; toastUndo = undo || null;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; toastUndo = null; }, undo ? 5000 : 2600);
}
const numOf = id => { const v = parseFloat(String($(id).value).replace(',', '.')); return Number.isFinite(v) ? v : null; };
/* вес и обхваты: отсекаем опечатки вроде 864 вместо 86,4 */
function badMeasure(kg, waist, hips){
  if (kg != null && (kg < 30 || kg > 300)) return 'Проверьте вес: от 30 до 300 кг';
  if (waist != null && (waist < 40 || waist > 200)) return 'Проверьте талию: от 40 до 200 см';
  if (hips != null && (hips < 40 || hips > 220)) return 'Проверьте бёдра: от 40 до 220 см';
  return '';
}
function putWeight(d, kg, waist){
  const i = S.weights.findIndex(w => w.d === d), old = i >= 0 ? S.weights[i] : {};
  const rec = { d, kg: kg ?? old.kg ?? null, waist: waist ?? old.waist ?? null };
  if (i >= 0) S.weights[i] = rec; else S.weights.push(rec);
}

/* ================= обработчики ================= */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, t = todayKey(), d = b.dataset;
  if (a !== 'restart' && a !== 'wipe' && confirmAct){ confirmAct = null; if (view === 'profile') renderProfile(); }
  switch (a){
    case 'tab': closeSheet(); show(d.v, d.to); break;
    case 'sheet-close': closeSheet(); if (view === 'today') renderToday(); break;
    case 'undo': if (toastUndo){ const f = toastUndo; toastUndo = null; $('toast').hidden = true; f(); } break;
    case 'clear-demo': S = blank(); save(); show('today'); break;
    case 'setup': sh = { kind:'setup' }; renderSheet(); openSheet(); break;
    case 'setup-save': {
      const name = $('su-name').value.trim(), start = $('su-start').value;
      if (!name){ $('su-name').focus(); toast('Напишите, как вас зовут'); break; }
      if (!start){ toast('Выберите дату старта'); break; }
      if (!$('su-ok').checked){ toast('Отметьте, что прочитали «Важно перед стартом»'); break; }
      S.profile.name = name; S.profile.sex = $('su-sex').value; S.profile.start = start; S.read.rules = true; save();
      sh = { kind:'point', w:'A', first:true, sc:{} }; renderSheet(); renderToday(); break;
    }
    case 'point': sh = { kind:'point', w:d.w, sc:{} }; renderSheet(); openSheet(); break;
    case 'score': sh.sc[d.id] = +d.n; { const keep = { kg:$('pt-kg').value, waist:$('pt-waist').value, hips:$('pt-hips').value };
      renderSheet(); $('pt-kg').value = keep.kg; $('pt-waist').value = keep.waist; $('pt-hips').value = keep.hips; } break;
    case 'point-save': {
      const B = sh.w === 'B', old = (B ? S.pointB : S.pointA) || { sc:{} };
      const rec = { d:t, kg:numOf('pt-kg'), waist:numOf('pt-waist'), hips:numOf('pt-hips'), sc:{ ...old.sc, ...sh.sc } };
      { const bad = badMeasure(rec.kg, rec.waist, rec.hips); if (bad){ toast(bad); break; } }
      if (B) S.pointB = rec; else S.pointA = { ...rec, d: old.d || t };
      if (rec.kg != null || rec.waist != null) putWeight(t, rec.kg, rec.waist);
      closeSheet(); commit(); toast(B ? 'Точка Б записана' : 'Точка А записана'); break;
    }
    case 'prep': S.prep[d.id] = !S.prep[d.id]; commit(); break;
    case 'rules': closeSheet(); show('program', 'rules-card'); break;
    case 'rules-ok': S.read.rules = true; commit(); break;
    case 'back-hide': S.back = null; commit(); break;
    case 'check': { const c = S.checks[t] = S.checks[t] || {}; c[d.id] = !c[d.id]; if (!c[d.id]) delete c[d.id]; commit(); break; }
    case 'water-add': S.water[t] = Math.max(0, (S.water[t] || 0) + Number(d.ml)); commit(); break;
    case 'water-set': { const n = +d.n, cur = Math.floor((S.water[t] || 0)/250); S.water[t] = (n === cur ? n - 1 : n)*250; commit(); break; }
    case 'energy': { const f = S.feel[t] = S.feel[t] || {}; f.energy = f.energy === +d.n ? undefined : +d.n; commit(); break; }
    case 'gut': { const f = S.feel[t] = S.feel[t] || {}; f.gut = f.gut === d.id ? undefined : d.id; commit(); break; }
    case 'sleep': { const f = S.feel[t] = S.feel[t] || {}; f.sleep = Math.min(14, Math.max(0, (f.sleep || 0) + Number(d.d))); commit(); break; }
    case 'habit': { const h = S.habits[t] = S.habits[t] || {}; h[d.id] = !h[d.id]; commit(); break; }
    case 'evening': sh = { kind:'evening' }; renderSheet(); openSheet(); break;
    case 'report': {
      const text = reportText(t);
      if (navigator.share) navigator.share({ text }).catch(() => {});
      else if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast('Отчёт скопирован — вставьте его в чат'), () => toast('Не получилось скопировать'));
      break;
    }
    case 'lesson': sh = { kind:'lesson', id:d.id }; renderSheet(); openSheet(); break;
    case 'lesson-read': S.read[d.id] = true; save(); closeSheet(); RENDER[view](); break;
    case 'space': { const was = S.space[d.id]; if (was) delete S.space[d.id]; else S.space[d.id] = t; save();
      if (sh && sh.kind === 'lesson') renderSheet(); RENDER[view](); if (!was) toast('Пространство стало свободнее'); break; }
    case 'breath': sh = { kind:'breath', id:d.id, run:false }; renderSheet(); openSheet(); break;
    case 'breath-go': if (sh.run){ stopBreath(); renderSheet(); } else startBreath(); break;
    case 'product': sh = { kind:'product', id:d.id }; renderSheet(); openSheet(); break;
    case 'fday': { const nd = dkey(addDays(parseKey(foodDay), +d.d)); if (nd <= t) foodDay = nd; renderFood(); break; }
    case 'plate': { const day = S.meals[foodDay] = S.meals[foodDay] || {}, m = day[d.m] = day[d.m] || {}; m[d.f] = !m[d.f]; commit(); break; }
    case 'ideas': ideaTab = d.k; renderFood(); break;
    case 'sstage': schedStage = +d.n; renderProgram(); break;
    case 'del-w': { const i = S.weights.findIndex(w => w.d === d.d); if (i < 0) break; const [gone] = S.weights.splice(i, 1); commit();
      toast('Запись удалена', () => { S.weights.push(gone); commit(); }); break; }
    case 'install': if (installEvt){ installEvt.prompt(); installEvt = null; renderProfile(); } break;
    case 'restart':
      if (confirmAct !== 'restart'){ confirmAct = 'restart'; renderProfile(); break; }
      confirmAct = null; S.profile.start = null; S.pointA = null; S.pointB = null; S.checks = {}; S.space = {}; S.read = {}; S.prep = {}; S.back = null;
      save(); show('today'); toast('Программа сброшена — выберите новую дату старта'); break;
    case 'wipe':
      if (confirmAct !== 'wipe'){ confirmAct = 'wipe'; renderProfile(); break; }
      confirmAct = null; try { localStorage.removeItem(KEY); } catch(e){} S = blank(); save(); show('today'); toast('Все записи удалены'); break;
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.meal){ const day = S.meals[foodDay] = S.meals[foodDay] || {}; (day[el.dataset.meal] = day[el.dataset.meal] || {}).text = el.value; save(); }
  else if (el.dataset.ev != null){ const t = todayKey(); (S.evening[t] = S.evening[t] || {})[el.dataset.ev] = el.value; save(); }
  else if (el.id === 'pf-name'){ S.profile.name = el.value.trim(); save(); }
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'pf-sex'){ S.profile.sex = e.target.value; save(); }
  else if (id === 'pf-water'){ S.profile.water = +e.target.value; save(); }
  else if (id === 'pf-start' && e.target.value){ S.profile.start = e.target.value; save(); toast('Дата старта: ' + fmtDay(e.target.value)); }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'w-form') return;
  e.preventDefault();
  const kg = numOf('w-kg'), waist = numOf('w-waist');
  if (kg == null && waist == null) return;
  { const bad = badMeasure(kg, waist); if (bad){ toast(bad); return; } }
  putWeight(todayKey(), kg, waist); commit(); toast('Замер записан');
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('sheet').hidden) closeSheet(); });
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (view === 'profile') renderProfile(); });

/* офлайн-режим: только в установленной версии на своём сайте */
if ('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]')){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

const start = location.hash.slice(1);
noteVisit();
show(VIEWS.includes(start) ? start : 'today');
/* установленное приложение может днями висеть в памяти телефона — новый день отмечаем и при возврате в него */
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && noteVisit()) RENDER[view](); });
})();
</script>
